<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gradNusa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="gradMipa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Letter N -->
  <g id="letter-N">
    <path d="M 28 32 L 28 88" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />
    <path d="M 30 36 L 70 84" stroke="#0F172A" stroke-width="11" stroke-linecap="round" />
    <path d="M 72 32 L 72 88" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />
    <circle cx="28" cy="32" r="4.5" fill="#2563EB" />
    <circle cx="72" cy="88" r="4.5" fill="#2563EB" />
  </g>

  <!-- Letter U -->
  <g id="letter-U">
    <path d="M 98 32 L 98 68 C 98 84 134 84 134 68 L 134 32" stroke="#0F172A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Letter S -->
  <g id="letter-S">
    <path d="M 194 42 C 194 32 160 30 160 45 C 160 62 196 58 196 75 C 196 90 160 90 158 78" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Letter A (Fused with Geo-Pin & Latitude Line) -->
  <g id="letter-A-nusa">
    <path d="M 216 88 L 238 34 L 260 88" stroke="#0F172A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 224 68 Q 238 62 252 68" stroke="#2563EB" stroke-width="6" stroke-linecap="round" />
    <circle cx="238" cy="22" r="7" fill="url(#pinGrad)" />
    <circle cx="238" cy="22" r="3" fill="#FFFFFF" />
    <path d="M 238 29 L 238 36" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Connector (-) 3-Cluster Link -->
  <g id="connector-hyphen">
    <line x1="280" y1="60" x2="316" y2="60" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 4" />
    <circle cx="286" cy="60" r="5" fill="#2563EB" />
    <circle cx="298" cy="60" r="5" fill="#D97706" />
    <circle cx="310" cy="60" r="5" fill="#EA580C" />
  </g>

  <!-- Letter M (Sigma Geometric) -->
  <g id="letter-M">
    <path d="M 338 88 L 338 34 L 358 64 L 378 34 L 378 88" stroke="url(#gradMipa)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="358" cy="64" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Letter I (Neural AI Node) -->
  <g id="letter-I">
    <path d="M 404 46 L 404 88" stroke="url(#gradMipa)" stroke-width="12" stroke-linecap="round" />
    <circle cx="404" cy="26" r="7.5" fill="#DCFCE7" />
    <circle cx="404" cy="26" r="4.5" fill="#16A34A" />
    <path d="M 404 15 L 404 18 M 404 34 L 404 37 M 393 26 L 396 26 M 412 26 L 415 26" stroke="#16A34A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Letter P (Curved Loop & Ratio Accent) -->
  <g id="letter-P">
    <path d="M 432 88 L 432 34" stroke="url(#gradMipa)" stroke-width="12" stroke-linecap="round" />
    <path d="M 432 34 L 452 34 C 466 34 466 62 452 62 L 432 62" stroke="url(#gradMipa)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="450" cy="48" r="3.5" fill="#16A34A" />
  </g>

  <!-- Letter A (Delta Gain Δ & Ascending Trend) -->
  <g id="letter-A-mipa">
    <path d="M 480 88 L 500 34 L 520 88" stroke="url(#gradMipa)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 488 68 L 512 68" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" />
    <path d="M 508 64 L 514 68 L 508 72" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sub-labels -->
  <text x="28" y="112" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.22em">
    SPATIAL ANALYTICS &amp; POLICY SIMULATOR
  </text>
  <text x="338" y="112" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#16A34A" letter-spacing="0.26em">
    EDUCATION 5.0
  </text>
</svg>
